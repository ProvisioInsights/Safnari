<text x="475.0" y="388" fill="#526579" font-size="13" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2×</text>
<line x1="590.0" y1="121" x2="590.0" y2="363" stroke="#dbe3e9" stroke-width="1"/>
<text x="590.0" y="388" fill="#526579" font-size="13" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">3×</text>
<line x1="705.0" y1="121" x2="705.0" y2="363" stroke="#dbe3e9" stroke-width="1"/>
<text x="705.0" y="388" fill="#526579" font-size="13" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">4×</text>
<line x1="820.0" y1="121" x2="820.0" y2="363" stroke="#dbe3e9" stroke-width="1"/>
<text x="820.0" y="388" fill="#526579" font-size="13" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">5×</text>
<line x1="475.0" y1="118" x2="475.0" y2="363" stroke="#087f77" stroke-width="2" stroke-dasharray="6 5"/>
<text x="482.0" y="113" fill="#087f77" font-size="13" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">2× release target</text>
<text x="215" y="167" fill="#14263d" font-size="17" font-weight="600" text-anchor="end" font-family="Arial, Helvetica, sans-serif">Small files</text>
<rect x="245" y="145" width="263.2" height="31" fill="#2866a3"/>
<text x="520.235" y="167" fill="#14263d" font-size="17" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">2.29×</text>
<text x="215" y="222" fill="#14263d" font-size="17" font-weight="600" text-anchor="end" font-family="Arial, Helvetica, sans-serif">Mixed heavy tail</text>
<rect x="245" y="200" width="247.9" height="31" fill="#2866a3"/>
