<svg xmlns="http://www.w3.org/2000/svg" width="960" height="506" viewBox="0 0 960 506" role="img" aria-labelledby="title description">
<title id="title">Safnari stripped executable size reduction</title>
<desc id="description">Five executable size reductions against equally stripped frozen builds: 39.3 percent for macOS ARM64, 38.1 percent for macOS Intel, 38.6 percent for Linux AMD64, 39.8 percent for Linux ARM64, 38.1 percent for Windows AMD64. Thirty percent is the release target.</desc>
