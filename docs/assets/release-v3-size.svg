<text x="586.0" y="413" fill="#526579" font-size="13" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">30%</text>
<line x1="688.0" y1="112" x2="688.0" y2="390" stroke="#dbe3e9" stroke-width="1"/>
<text x="688.0" y="413" fill="#526579" font-size="13" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">40%</text>
<line x1="790.0" y1="112" x2="790.0" y2="390" stroke="#dbe3e9" stroke-width="1"/>
<text x="790.0" y="413" fill="#526579" font-size="13" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">50%</text>
