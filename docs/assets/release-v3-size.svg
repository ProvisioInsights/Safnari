<text x="48" y="82" fill="#526579" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Reduction from equally stripped frozen-source builds</text>
<line x1="280.0" y1="112" x2="280.0" y2="390" stroke="#657587" stroke-width="1"/>
<text x="280.0" y="413" fill="#526579" font-size="13" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">0%</text>
