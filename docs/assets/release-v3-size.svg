<text x="48" y="353" fill="#14263d" font-size="17" font-weight="600" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Windows AMD64</text>
<text x="48" y="371" fill="#526579" font-size="13" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">16.10 MiB</text>
