name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - run: make lint
      - run: make test
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # govulncheck panics with GOEXPERIMENT=jsonv2 as of current toolchain.
          # Run without jsonv2 tags to keep vulnerability scanning functional.
          govulncheck ./...
        working-directory: src

  native-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            race: true
          - os: macos-15-intel
            race: true
          - os: ubuntu-24.04-arm
            race: true
          - os: windows-latest
            race: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Native tests
        run: GOEXPERIMENT=jsonv2 go test -tags jsonv2 ./...
        working-directory: src
        shell: bash
      - name: Scanner and delivery race tests
        if: matrix.race
        run: GOEXPERIMENT=jsonv2 go test -race -tags jsonv2 ./scanner ./output ./config
        working-directory: src
        shell: bash

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Install Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run Gitleaks
        id: gitleaks
        run: |
          set +e
          gitleaks dir . --redact=100 --report-format sarif --report-path gitleaks-results.sarif
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Gitleaks results
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-results.sarif

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run Trivy filesystem scan
        run: trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --format sarif --output trivy-results.sarif .

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on Gitleaks findings
        if: steps.gitleaks.outputs.exit_code != '0'
        run: exit 1

  build:
    needs:
      - test
      - native-test
      - security
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Build release and diagnostic binaries
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} make build-release VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: safnari-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/safnari-${{ matrix.goos }}-${{ matrix.goarch }}*
      - uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/debug/safnari-${{ matrix.goos }}-${{ matrix.goarch }}*

  sbom:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bin

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Generate SBOMs
        run: |
          mkdir -p artifacts/sbom
          syft dir:. -o spdx-json=artifacts/sbom/source.spdx.json
          syft dir:bin -o spdx-json=artifacts/sbom/binaries.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: artifacts/sbom
